# Alembic 설정 파일
#
# DATABASE_URL 은 여기 직접 안 쓰고, env.py 에서 환경변수로 동적 주입
# → 환경별 (dev/prod) 다른 DB 에 같은 Alembic 으로 마이그레이션 가능

[alembic]
# 마이그레이션 스크립트 위치
script_location = alembic

# 마이그레이션 파일 이름 형식
# 예: 2026_06_09_1234-abc123_add_users_table.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# UTC 사용
timezone = UTC

# 마이그레이션 파일에 import 할 prepend
# (필요 시 사용)
# prepend_sys_path = .

# DB URL 은 env.py 에서 동적 처리하므로 비워둠
sqlalchemy.url =

# 새 마이그레이션 자동 lint 적용
# autogenerate 가 만든 파일은 ruff 스타일(import 정렬 등)에 안 맞는 경우가
# 많아 매번 손으로 ruff check --fix 를 돌려야 했다 — 여기서 자동화.
[post_write_hooks]
hooks = ruff-format, ruff-check

# ruff 는 순수 바이너리라 console_scripts 엔트리포인트가 없다(2026-07-27
# 확인) — Python entrypoint 조회 대신 exec 타입으로 바로 실행해야 한다.
ruff-format.type = exec
ruff-format.executable = ruff
ruff-format.options = format REVISION_SCRIPT_FILENAME

ruff-check.type = exec
ruff-check.executable = ruff
ruff-check.options = check --fix REVISION_SCRIPT_FILENAME


# ─── 로깅 ───
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
