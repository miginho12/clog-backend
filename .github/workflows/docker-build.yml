name: Docker Build & Push

on:
  push:
    branches: [main]
    # v* 태그 트리거 제거(L1 C-2, 2026-11-12): 버전 태그 이미지는 release.yml 이 기존 sha 이미지에 태그만 추가
  pull_request:
    branches: [main]
  # 주간 정기 검사 (H1 재발 방지, 2026-11-09): push 가 없어도 새 CVE 를
  # pip-audit 로 잡아 notify-failure → Discord. 월 00:00 UTC = 09:00 KST
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clog
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: clog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: clog
      DB_PASSWORD: test_password
      DB_NAME: clog_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # tests/test_transcode_scale.py 가 실제 ffmpeg 로 영상 크기를 검증 (CI 에선 skip 금지)
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app

      - name: Security audit (pip-audit)
        # 예외 없음 (2026-11-09): python-jose → PyJWT 이전(ADR-075)으로 무시하던
        # PYSEC-2026-1325(ecdsa)·CVE-2026-85394(python-jose) 의 원인 패키지가 사라짐.
        # 새 예외가 필요하면 사유·확인 날짜를 여기에 적고 --ignore-vuln 으로 추가할 것.
        run: uv run pip-audit

      - name: Generate ephemeral JWT keypair
        run: |
          openssl genrsa -out /tmp/jwt-private.pem 2048
          openssl rsa -in /tmp/jwt-private.pem -pubout -out /tmp/jwt-public.pem
          echo "JWT_PRIVATE_KEY_PATH=/tmp/jwt-private.pem" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_PATH=/tmp/jwt-public.pem" >> "$GITHUB_ENV"

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -v

  build:
    needs: test
    # 정기 검사·수동 실행은 test 만 — 이미지 push·gitops 태그 bump 를 하지 않는다
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update GitOps image tag
        if: github.event_name != 'pull_request'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "Updating values-dev.yaml image tag to ${SHA_TAG}"

          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/miginho12/gitops.git /tmp/gitops
          cd /tmp/gitops

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          sed -i "s/^  tag: .*/  tag: \"${SHA_TAG}\"/" apps/clog/values-dev.yaml

          git add apps/clog/values-dev.yaml
          git diff --cached --quiet && echo "No changes, skipping commit" && exit 0
          git commit -m "chore: bump clog image tag to ${SHA_TAG}"
          git push

  notify-failure:
    needs: [test, build]
    if: always() && contains(needs.*.result, 'failure') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord on CI failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ **clog-backend** CI 실패 (${{ github.ref_name }})\\n커밋: \`${{ github.sha }}\`\\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
