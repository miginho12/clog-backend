name: Release

# SemVer 릴리스 (감사 L1 C-2, 2026-11-12)
# 1) main 빌드(Docker Build & Push)가 성공하면 release-please 가 conventional commits 로
#    release PR(버전·CHANGELOG)을 만들거나 갱신한다.
# 2) 그 release PR 을 병합 → 병합 커밋의 빌드가 성공하면 GitHub Release + vX.Y.Z 태그 생성
# 3) 이미 빌드된 sha-xxxxxxx 이미지에 X.Y.Z / X.Y 태그만 추가한다(재빌드 없음 →
#    dev 에서 검증한 이미지와 같은 digest). gitops 는 지금처럼 sha 태그로 승격한다.
#
# - release-please 는 GitHub App(miginho12 release bot) 의 설치 토큰으로 돈다(2026-11-14).
#   기본 GITHUB_TOKEN 으로 만든 PR 은 pull_request 실행이 "승인 필요"(action_required) 로만 생기고,
#   승인 없이 갱신·병합되면 job 0개 failure("workflow file issue") 로 남았다 → release PR 에 CI 가
#   안 돌고 빨간 X 가 상시 떠 진짜 실패를 가렸다. App 토큰이 만든 PR 은 일반 PR 처럼 CI 가 돈다.
#   토큰은 실행마다 발급(1시간), 이 저장소·contents/pull-requests/issues 쓰기로만 좁힌다.
#   비밀 값: vars.RELEASE_APP_CLIENT_ID · secrets.RELEASE_APP_PRIVATE_KEY (App 설정에서 재발급 가능)
# - 이미지 태그는 태그 push 로 재빌드하지 않고 아래 tag-image 가 기존 sha 이미지에 직접 붙인다.
# - v1.0.0 은 도입 시점 기준선(수동 생성) — 이미지 태그는 workflow_dispatch 로 붙인다.
on:
  workflow_run:
    workflows: ["Docker Build & Push"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "이미지 태그를 붙일 기존 릴리스 버전 (예: 1.0.0)"
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release-please:
    # 정기 검사(schedule)·수동 실행 빌드가 아니라 main push 빌드가 성공했을 때만
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # GITHUB_TOKEN 은 쓰지 않는다(아래 App 토큰으로 대체) → 권한 없음
    permissions: {}
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  tag-image:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve version and commit
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          RP_VERSION: ${{ needs.release-please.outputs.version }}
          RP_SHA: ${{ needs.release-please.outputs.sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
            SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/v${VERSION}" --jq .sha)
          else
            VERSION="${RP_VERSION}"
            SHA="${RP_SHA}"
          fi
          echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "잘못된 버전: ${VERSION}"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "${VERSION}" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$(echo "${SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Add version tags to the built image
        env:
          VERSION: ${{ steps.v.outputs.version }}
          MINOR: ${{ steps.v.outputs.minor }}
          SHA_TAG: ${{ steps.v.outputs.sha_tag }}
        run: |
          set -euo pipefail
          SRC="${IMAGE}:${SHA_TAG}"
          # 릴리스 커밋의 빌드가 없으면(실패 등) 여기서 멈춘다 — 다른 이미지에 버전을 붙이지 않음
          docker buildx imagetools inspect "${SRC}" > /dev/null
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" -t "${IMAGE}:${MINOR}" "${SRC}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" | head -3
          echo "${SRC} → ${VERSION}, ${MINOR}" >> "$GITHUB_STEP_SUMMARY"
